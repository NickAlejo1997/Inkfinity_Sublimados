<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
    <f:view locale="#{mensajesBean.locale}">
        <html lang="#{mensajesBean.idioma}">
        <h:head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <ui:insert name="metadata" />
            <title><ui:insert name="title" /></title>
            <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
            <ui:insert name="styles" />
            <script defer="defer" src="#{facesContext.externalContext.requestContextPath}/assets/idioma.js"></script>
            <script defer="defer" src="#{facesContext.externalContext.requestContextPath}/assets/moneda.js"></script>
        </h:head>
        <h:body class="#{pageBodyClass}"
                pt:data-base-currency="PEN"
                pt:data-currency="#{monedaBean.codigo}"
                pt:data-number-locale="#{monedaBean.locale}"
                pt:data-language="#{mensajesBean.idioma}">
            <ui:insert name="content" />
            <p id="estadoMoneda" class="mx-auto max-w-7xl px-4 py-2 text-sm text-amber-800" role="status" aria-live="polite" hidden="hidden" data-i18n="moneda.error">#{msg['moneda.error']}</p>
        </h:body>
        </html>
    </f:view>
</ui:composition>
